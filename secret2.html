<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Authorized</title>
</head>
<body>
<h1>MWSCCクレジット追加サービス</h1>
<code>証拠写真をスクショして主に送ってね</code>
<div class="Creditcharge"><button onclick="go()">カード残高を追加する</button></div>
<select id="Money">
  <option value="a">通貨を選んでください</option>
  <option value="円">円</option>
  <option value="ドル">ドル</option>
  <option value="ユーロ">ユーロ</option>
  <option value="ウォン">ウォン</option>
  <option value="ジンバブエドル">ジンバブエドル</option>
  <option value="金マルク">金マルク</option>
  <option value="もっち">もっち</option>
</select>
<script>
  function go() {
    let selected = document.getElementById("Money").value;
    let chargemoney = prompt("チャージしたい金額を指定してください");
    if (chargemoney === null) {
  alert("キャンセルされました");
} else if (isNaN(chargemoney) || chargemoney.trim() === "") {
  alert("正しい金額を入力してください。");
} else if (selected === "a") {
    alert("通貨を選んでください。");
}else if (chargemoney >= 10000000000000001 || chargemoney <= 249) {
　　　alert("金額は250" + selected +"以上1京" + selected + "以下にしてください。");
}else {
  alert(chargemoney + selected + "チャージしました");
  }
}
</script>
<style>
.Creditcharge button {
  font-size: 30px;
  padding: 20px 40px;
  border-radius: 15px;
  background-color: black;
  color: white;
  cursor: pointer;
}
</style>
</body>
</html>
