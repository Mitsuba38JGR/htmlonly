<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-box">
  <h1>hi</h1>
  <select>
    <option>グエー死んだンゴ</option>
    <option>かんかんかんかん</option>
    <option>シンゴ黙れ</option>
  </select>
  <p>hey</p>
  <h3>lol</h3>
  <button onclick="hello()">押してね</button></div>
<script>
function hello() {
    let name = prompt("名前を入力してください");
if (name === null) {
    alert("キャンセルしました");
} else {
    alert("fuckin', " + name + "!");
}
}
</script>
<div class="check-button"><br><button onclick="check()">確認する</button></div>
<script>
function check() {
    let result = confirm("本当に実行しますか？");

    if (result) {
        alert("OKが押されました");
    } else {
        alert("キャンセルされました");
    }
}
</script>
<div class="code-box"><h2>コードを入力</h2>
<input type="password" id="password">
<button id="loginBtn">ENTER</button>
<p id="message"></p>
</div>
<script>
const correctPasswords = ["4019240141608763", "0142867393501426", "1742639752804128"]; // ← 正解パスワード
let attempts = 0;
let lockUntil = 0;

const btn = document.getElementById("loginBtn");
const msg = document.getElementById("message");

btn.addEventListener("click", function() {

    const now = Date.now();

    // ロック中かチェック
    if (now < lockUntil) {
        const seconds = Math.ceil((lockUntil - now) / 1000);
        msg.textContent = "ロック中... 残り " + seconds + " 秒";
        return;
    }

    const input = document.getElementById("password").value;

    if (correctPasswords.includes(input)) {
        msg.textContent = "Welcome back.";
        setTimeout(function() {
            window.location.href = "secret.html";
        }, 1000);
    } else {
        attempts++;
        msg.textContent = "パスワードが違います (" + attempts + "/3)";

        if (attempts >= 3) {
            lockUntil = Date.now() + 5 * 60 * 1000; // 5分ロック
            msg.textContent = "3回失敗。5分間ロックします。";
            attempts = 0;
        }
    }
});
</script>
</html>
